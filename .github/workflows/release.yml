name: Release

# Pushing a vX.Y.Z tag on main builds cubertgmbh/cuvis_base:X.Y.Z-ubuntu* for every
# variant and creates a GitHub Release from the CHANGELOG.md section.
# A pre-release tag (vX.Y.Zrc1) pushes the same image tags but creates no release.
# A manual run rebuilds the images of an existing release from its tag, for SDK installers
# that were replaced under the same version, and appends the reason to that release.
# Dry runs are local: CUVIS_VERSION=X.Y.Z docker buildx bake amd64
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose images to rebuild (e.g. v3.6.1)
        required: true
        type: string
      reason:
        description: Why the images are rebuilt; published on the release page
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      sdk: ${{ steps.meta.outputs.sdk }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      matrix: ${{ steps.targets.outputs.matrix }}
      tags: ${{ steps.targets.outputs.tags }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - id: meta
        uses: ./.github/actions/release-meta
        with:
          version: ${{ inputs.tag || github.ref_name }}

      - name: A rebuild targets an existing final release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REASON: ${{ inputs.reason }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            echo "::error::${TAG} is a pre-release tag; it has no GitHub Release to record the rebuild on."
            exit 1
          fi
          if [ -z "${REASON//[[:space:]]/}" ]; then
            echo "::error::reason is empty."
            exit 1
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name --jq '"Rebuilding \(.name)"'

      - uses: ./.github/actions/tag-on-main

      - uses: ./.github/actions/changelog
        with:
          version: ${{ steps.meta.outputs.sdk }}
          prerelease: ${{ steps.meta.outputs.prerelease }}

      - name: Download the SDK release
        env:
          SDK: ${{ steps.meta.outputs.sdk }}
        run: |
          url="https://cloud.cubert-gmbh.de/s/cuvis_sdk_release_ver_${SDK//./}/download"
          if ! curl -fsSL -o "$RUNNER_TEMP/sdk.zip" "$url"; then
            echo "cuvis SDK ${SDK} is not available at ${url}."
            exit 1
          fi

      # A pre-release may ship without some variants (typically the Jetson packages); those
      # images are skipped with a warning. A final release needs all of them.
      - name: Select the variants the SDK download packages
        id: targets
        env:
          CUVIS_VERSION: ${{ steps.meta.outputs.sdk }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          docker buildx bake --print \
            | python3 .github/scripts/sdk_targets.py --sdk-zip "$RUNNER_TEMP/sdk.zip" \
                $([ "$PRERELEASE" = true ] || echo --strict) \
            >> "$GITHUB_OUTPUT"

  build:
    name: Build and push (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    environment: dockerhub
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/bake-action@v7
        env:
          CUVIS_VERSION: ${{ needs.validate.outputs.sdk }}
        with:
          source: .
          files: docker-bake.hcl
          targets: ${{ matrix.targets }}
          push: true

  smoke:
    name: Pull and inspect
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - name: Every pushed tag resolves and the amd64 ones carry the SDK
        env:
          TAGS: ${{ needs.validate.outputs.tags }}
        run: |
          for image in $TAGS; do
            docker manifest inspect "$image" > /dev/null
            case "$image" in
              *-arm64) echo "$image: manifest ok" ;;
              *) docker run --rm "$image" dpkg -s libcuvis cuviscommon | grep -E '^(Package|Version):' ;;
            esac
          done

  github-release:
    name: Create GitHub release
    needs: [validate, smoke]
    if: needs.validate.outputs.prerelease == 'false' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - id: notes
        uses: ./.github/actions/changelog
        with:
          mode: extract
          version: ${{ needs.validate.outputs.sdk }}

      - uses: softprops/action-gh-release@v2
        with:
          name: cuvis_base ${{ needs.validate.outputs.sdk }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: false

  record-rebuild:
    name: Record the rebuild on the release
    needs: [validate, smoke]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REASON: ${{ inputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/body.md"
          {
            grep -qx '## Image Rebuilds' "$RUNNER_TEMP/body.md" || printf '\n## Image Rebuilds\n\n'
            echo "- $(date -u +%F) - ${REASON} ([run](${RUN_URL}))"
          } >> "$RUNNER_TEMP/body.md"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/body.md"
