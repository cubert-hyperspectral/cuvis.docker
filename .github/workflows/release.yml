name: Release

# Pushing a vX.Y.Z tag on main builds cubertgmbh/cuvis_base:X.Y.Z-ubuntu* for every
# variant and creates a GitHub Release from the CHANGELOG.md section.
# A pre-release tag (vX.Y.Zrc1) pushes the same image tags but creates no release.
# Dry runs are local: CUVIS_VERSION=X.Y.Z docker buildx bake amd64
on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      sdk: ${{ steps.meta.outputs.sdk }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: meta
        uses: ./.github/actions/release-meta
        with:
          version: ${{ github.ref_name }}

      - uses: ./.github/actions/tag-on-main

      - uses: ./.github/actions/changelog
        with:
          version: ${{ steps.meta.outputs.sdk }}
          prerelease: ${{ steps.meta.outputs.prerelease }}

      - name: Verify the SDK release is downloadable
        env:
          SDK: ${{ steps.meta.outputs.sdk }}
        run: |
          url="https://cloud.cubert-gmbh.de/s/cuvis_sdk_release_ver_${SDK//./}/download"
          if ! curl -fsSIL -o /dev/null "$url"; then
            echo "cuvis SDK ${SDK} is not available at ${url}."
            exit 1
          fi

  build:
    name: Build and push (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    environment: dockerhub
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/bake-action@v7
        env:
          CUVIS_VERSION: ${{ needs.validate.outputs.sdk }}
        with:
          source: .
          files: docker-bake.hcl
          targets: ${{ matrix.arch }}
          push: true

  smoke:
    name: Pull and inspect
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - name: The pushed tag resolves and carries the SDK
        env:
          IMAGE: cubertgmbh/cuvis_base:${{ needs.validate.outputs.sdk }}-ubuntu24.04
        run: docker run --rm "$IMAGE" dpkg -s libcuvis cuviscommon

  github-release:
    name: Create GitHub release
    needs: [validate, smoke]
    if: needs.validate.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - id: notes
        uses: ./.github/actions/changelog
        with:
          mode: extract
          version: ${{ needs.validate.outputs.sdk }}

      - uses: softprops/action-gh-release@v2
        with:
          name: cuvis_base ${{ needs.validate.outputs.sdk }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: false
